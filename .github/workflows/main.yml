name: Sync Latest ViolentMonkey Release

on:
  schedule:
    # 每天同步一次最新 release
    - cron: "0 5 * * *"
  workflow_dispatch: # 允许手动触发

jobs:
  sync-releases:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v3

    - name: Set up Git
      run: |
        git config user.name "klcb2010"
        git config user.email "klcb2010@gmail.com"

    - name: Set up GitHub Token
      run: echo "GITHUB_TOKEN=${{ secrets.GITHUB_TOKEN }}" >> $GITHUB_ENV

    - name: Fetch latest release from ViolentMonkey
      run: |
        # 获取最新发布标签
        latest_tag=$(curl -s https://api.github.com/repos/violentmonkey/violentmonkey/releases/latest | jq -r '.tag_name')
        echo "Fetching latest release for tag: $latest_tag"
        
        # 获取该发布的所有资产下载链接
        assets=$(curl -s https://api.github.com/repos/violentmonkey/violentmonkey/releases/tags/$latest_tag | jq -r '.assets[].browser_download_url')

        # 创建新的发布（release）
        release_response=$(curl -s -X POST https://api.github.com/repos/klcb2010/violentmonkey/releases \
          -H "Authorization: token $GITHUB_TOKEN" \
          -d "{
            \"tag_name\": \"$latest_tag\",
            \"name\": \"Release $latest_tag\",
            \"body\": \"This is the release for version $latest_tag\",
            \"draft\": false,
            \"prerelease\": false
          }"
        )

        # 获取新发布的 ID
        release_id=$(echo $release_response | jq -r '.id')

        # 下载并上传所有资产到新发布
        for asset in $assets; do
          file_name=$(basename "$asset")
          new_file_name="${file_name%.zip}.xpi" # 修改后缀
          echo "Downloading $file_name and renaming to $new_file_name"
          
          # 下载文件
          curl -L -o "$file_name" "$asset"
          
          # 重命名文件
          mv "$file_name" "$new_file_name"
          
          # 上传文件到发布
          curl -X POST -H "Authorization: token $GITHUB_TOKEN" \
            -H "Content-Type: application/octet-stream" \
            --data-binary @"$new_file_name" \
            "https://uploads.github.com/repos/klcb2010/violentmonkey/releases/$release_id/assets?name=$new_file_name"
        done
